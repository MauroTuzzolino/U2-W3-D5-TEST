<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dettagli Prodotto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container py-5">
      <h1 class="mb-4" id="product-name"></h1>

      <div class="row">
        <div class="col-md-6">
          <img id="product-image" class="img-fluid" alt="Product Image" />
        </div>
        <div class="col-md-6">
          <h2 id="product-brand"></h2>
          <p id="product-description"></p>
          <p class="fw-bold">Prezzo: € <span id="product-price"></span></p>
          <a href="index.html" class="btn btn-secondary">Torna indietro</a>
        </div>
      </div>
    </div>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get("id");

      if (productId) {
        fetch("https://striveschool-api.herokuapp.com/api/product/" + productId, {
          headers: {
            Authorization:
              "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJfaWQiOiI2ODE0NzllZDFjMjUwNDAwMTUxYWI2NTAiLCJpYXQiOjE3NDYxNzIzOTcsImV4cCI6MTc0NzM4MTk5N30.u8Ac726nS_MPU1v1Dlbh1CZEBgfTY5QmZoe1BrzxqBU",
          },
        })
          .then((response) => response.json())
          .then((data) => {
            document.getElementById("product-name").textContent = data.name;
            document.getElementById("product-image").src = data.imageUrl;
            document.getElementById("product-brand").textContent = data.brand;
            document.getElementById("product-description").textContent = data.description;
            document.getElementById("product-price").textContent = data.price.toFixed(2);
          })
          .catch((error) => {
            console.error("Errore nel caricamento del prodotto:", error);
          });
      }
    </script>
  </body>
</html>
